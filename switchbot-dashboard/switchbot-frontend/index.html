<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temp Master Dashboard</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f5f5f5;
      padding-top: 70px;
    }
    .meter-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meter-card-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }
    .meter-stats .badge {
      font-size: 14px;
      margin-right: 6px;
      padding: 4px 8px;
    }
    .meter-stats {
      margin-bottom: 10px;
    }
    .meter-chart-wrap {
      position: relative;
      height: 200px;
    }
    .meter-last-updated {
      color: #777;
      font-size: 12px;
      margin-top: 8px;
      margin-bottom: 0;
    }
    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin: 30px 0 20px 0;
    }
    #loading {
      text-align: center;
      padding: 40px 0;
    }
    .card > .card-header {
      background-color: #f8f8f8;
    }
    .device-type-tag {
      font-size: 11px;
      color: #777;
      background-color: #eee;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .meter-section {
      margin-bottom: 20px;
    }
    .meter-section-header {
      margin-bottom: 10px;
    }
    .meter-section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #8a6d3b;
    }
    .meter-section-subtitle {
      margin: 4px 0 0;
      color: #8a6d3b;
      font-size: 12px;
    }
    .stale-meters-card {
      border-color: #f0ad4e;
      background-color: #fcf8e3;
    }
    .stale-meter-badge {
      display: inline-block;
      margin-left: 8px;
    }
    .stale-meter-empty {
      color: #8a6d3b;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand navbar-light bg-light fixed-top border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Temp Master Dashboard</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Dashboard</a>
        </li>
      </ul>
      <span id="connection-status" class="badge text-bg-success">Connected</span>
    </div>
  </nav>

  <div class="container-fluid">

    <!-- Controls -->
    <div class="card mb-3">
      <div class="card-body">
        <form class="row row-cols-lg-auto g-3 align-items-center">
          <div class="col-12">
            <label class="form-label mb-0 me-2" for="time-scale-select">Time Range:</label>
          </div>
          <div class="col-12">
            <select id="time-scale-select" class="form-select">
              <option value="hour">Last Hour</option>
              <option value="day" selected>Last 24 Hours</option>
              <option value="week">Last 7 Days</option>
              <option value="month">Last 30 Days</option>
              <option value="year">Last Year</option>
            </select>
          </div>
          <div class="col-12">
            <button type="button" id="btn-refresh" class="btn btn-primary">Refresh Data</button>
          </div>
          <div class="col-12">
            <button type="button" id="btn-backup" class="btn btn-secondary">Download Backup</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="alert alert-info d-none">
      <span id="status-meters-count">Monitoring 0 meters</span>
      <span class="float-end" id="status-last-refresh"></span>
    </div>

    <!-- Rate Limit Warning -->
    <div id="rate-limit-warning" class="alert alert-warning d-none">
      <strong>Rate Limited.</strong>
      <span id="rate-limit-text">SwitchBot API rate limit reached.</span>
    </div>

    <!-- Loading -->
    <div id="loading">
      <p class="text-muted">Loading temperature data...</p>
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-danger d-none">
      <strong>Error.</strong> <span id="error-text">Failed to fetch data.</span>
    </div>

    <!-- Meters Container -->
    <div id="meters-container"></div>

    <!-- Footer -->
    <footer>
      Temp Master Dashboard v1.0 - Built with Bootstrap 5
    </footer>

  </div>

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js 4 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

  <script>
    // ============================================================
    // Global variables
    // ============================================================

    // Data is served by the snakeroom backend, which actively collects readings
    // from the same SwitchBot devices. Point all API calls there.
    const API_URL = 'https://snakeroom.fly.dev';

    const REFRESH_INTERVAL = 30000;
    const STALE_METER_THRESHOLD_MS = 7 * 24 * 60 * 60 * 1000;
    let currentTimeScale = 'day';
    let metersData = [];
    let statusData = null;
    let charts = {}; // device_id -> Chart instance map

    const DISPLAY_NAMES = {
      'Bedroom Meter': '第1蒸留塔 (T-101)',
      'Living Meter': '第2蒸留塔 (T-102)',
      '2世': '反応器 (R-201)',
      '夢男': '熱交換器 (E-301)',
      '夢': '熱交換器 (E-302)',
      'アワコ': '冷却塔 (CT-401)',
      'ジャガ百万石': '加熱炉 (H-501)',
      'ネズミ': 'コンプレッサー (C-601)',
      'バロン': '遠心分離機 (S-701)',
      'ゴンタ': '混合槽 (M-801)',
      '蛇棚': '貯蔵タンク (TK-901)',
      '中華棚': '貯蔵タンク (TK-902)',
      'へておケージ': '配管ライン (PL-1001)',
      '外': '屋外モニター (EM-1101)',
      'インキュベーター': '乾燥機 (D-1201)',
      'ビアク': '吸収塔 (A-1301)',
      'ブロッチ Hot Spot': 'フレアスタック (FS-1401)',
      'マダラアオジタ': 'ボイラー (B-1501)'
    };

    function getDisplayName(deviceName) {
      return DISPLAY_NAMES[deviceName] || deviceName;
    }

    // ============================================================
    // Utility functions
    // ============================================================

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function pad2(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function show(selector) {
      document.querySelector(selector).classList.remove('d-none');
    }

    function hide(selector) {
      document.querySelector(selector).classList.add('d-none');
    }

    function setText(selector, text) {
      document.querySelector(selector).textContent = text;
    }

    // Ported from src/components/Chart.tsx (lines 33-49)
    function formatTimestamp(timestamp, timeScale) {
      const date = new Date(timestamp);
      const hours = pad2(date.getHours());
      const minutes = pad2(date.getMinutes());
      const dayShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
      const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][date.getMonth()];
      const dayNum = date.getDate();

      switch (timeScale) {
        case 'hour':
          return hours + ':' + minutes;
        case 'day':
          return hours + ':' + minutes;
        case 'week':
          return dayShort + ' ' + hours;
        case 'month':
          return monthShort + ' ' + dayNum;
        case 'year':
          return monthShort + ' ' + dayNum;
        default:
          return date.toLocaleString();
      }
    }

    // ============================================================
    // API calls (fetch)
    // ============================================================

    async function requestJson(path, options) {
      const response = await fetch(API_URL + path, options);
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.json();
    }

    function fetchMeters() {
      return requestJson('/api/meters');
    }

    function fetchStatus() {
      return requestJson('/api/status');
    }

    function fetchHistory(deviceId, timeScale) {
      const query = new URLSearchParams({ time_scale: timeScale });
      return requestJson('/api/meters/' + encodeURIComponent(deviceId) + '/history?' + query);
    }

    function triggerRefresh() {
      return requestJson('/api/meters/refresh', { method: 'POST' });
    }

    // ============================================================
    // Top-level data load
    // ============================================================

    async function fetchData() {
      let metersResp;
      try {
        metersResp = await fetchMeters();
      } catch (err) {
        showError('Failed to fetch meters: ' + err.message);
        return;
      }

      let statusResp;
      try {
        statusResp = await fetchStatus();
      } catch (err) {
        showError('Failed to fetch status: ' + err.message);
        return;
      }

      metersData = (metersResp && metersResp.meters) ? metersResp.meters : [];
      statusData = statusResp;

      hide('#loading');
      hide('#error');
      const status = document.querySelector('#connection-status');
      status.classList.remove('text-bg-danger');
      status.classList.add('text-bg-success');
      status.textContent = 'Connected';

      updateStatusBar();
      renderMeters();
      renderCharts();
    }

    function refreshDashboard() {
      fetchData().catch(function(err) {
        showError('Failed to load dashboard: ' + err.message);
      });
    }

    function showError(msg) {
      hide('#loading');
      setText('#error-text', msg);
      show('#error');
      const status = document.querySelector('#connection-status');
      status.classList.remove('text-bg-success');
      status.classList.add('text-bg-danger');
      status.textContent = 'Disconnected';
    }

    // ============================================================
    // Status bar / rate limit
    // ============================================================

    function updateStatusBar() {
      if (!statusData) {
        hide('#status-bar');
        return;
      }

      const count = statusData.meters_count || 0;
      const noun = count === 1 ? 'meter' : 'meters';
      setText('#status-meters-count', 'Monitoring ' + count + ' ' + noun);

      const now = new Date();
      const refreshText = 'Last refresh: ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
      setText('#status-last-refresh', refreshText);
      show('#status-bar');

      if (statusData.is_rate_limited) {
        const remaining = statusData.backoff_remaining || 0;
        setText('#rate-limit-text', 'SwitchBot API rate limit reached. Retry in ' + remaining + ' seconds.');
        show('#rate-limit-warning');
      } else {
        hide('#rate-limit-warning');
      }
    }

    // ============================================================
    // Rendering
    // ============================================================

    function renderMeters() {
      renderDefaultView();
    }

    function renderDefaultView() {
      const activeMeters = [];
      const staleMeters = [];

      for (const meter of metersData) {
        if (isStaleMeter(meter)) {
          staleMeters.push(meter);
        } else {
          activeMeters.push(meter);
        }
      }

      let html = renderMeterGrid(activeMeters);
      if (staleMeters.length > 0) {
        html += renderStaleMetersSection(staleMeters);
      }
      document.querySelector('#meters-container').innerHTML = html;
    }

    function renderMeterGrid(meters) {
      if (!meters.length) {
        return '';
      }

      let html = '<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">';
      for (const meter of meters) {
        html += '<div class="col">' + createMeterCard(meter, false) + '</div>';
      }
      html += '</div>';
      return html;
    }

    function renderStaleMetersSection(meters) {
      let html = '';
      html += '<div class="meter-section mt-4">';
      html += '  <div class="meter-section-header">';
      html += '    <h3 class="meter-section-title"><span aria-hidden="true">\u26a0</span> 未更新のメーター</h3>';
      html += '    <p class="meter-section-subtitle">1週間以上更新されていないデバイス</p>';
      html += '  </div>';
      html += '  <div class="card stale-meters-card">';
      html += '    <div class="card-body">';
      html += '      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">';
      for (const meter of meters) {
        html += '<div class="col">' + createMeterCard(meter, true) + '</div>';
      }
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
      return html;
    }

    function createMeterCard(meter, isStale) {
      const deviceId = escapeHtml(meter.device_id);
      const deviceName = escapeHtml(getDisplayName(meter.device_name));
      const deviceType = escapeHtml(meter.device_type);

      let html = '';
      html += '<div class="card h-100">';
      html += '  <div class="card-header">';
      html += '    <div class="meter-card-header">';
      html += '      <div class="meter-card-title">';
      html += '        <strong>' + deviceName + '</strong>';
      if (isStale) {
        html += '        <span class="badge text-bg-warning stale-meter-badge">7日以上未更新</span>';
      }
      html += '      </div>';
      html += '      <span class="device-type-tag">' + deviceType + '</span>';
      html += '    </div>';
      html += '  </div>';
      html += '  <div class="card-body">';
      html += '    <div class="meter-stats">';

      if (meter.current_temperature !== null && meter.current_temperature !== undefined) {
        html += '<span class="badge text-bg-danger">' + escapeHtml(meter.current_temperature) + '\u00b0C</span>';
      }
      if (meter.current_humidity !== null && meter.current_humidity !== undefined) {
        html += '<span class="badge text-bg-info">' + escapeHtml(meter.current_humidity) + '%</span>';
      }
      if (meter.battery !== null && meter.battery !== undefined) {
        html += '<span class="badge text-bg-success">' + escapeHtml(meter.battery) + '%</span>';
      }

      html += '    </div>';
      if (isStale) {
        html += '    <p class="stale-meter-empty">履歴データの取得対象外</p>';
      } else {
        html += '    <div class="meter-chart-wrap">';
        html += '      <canvas id="chart-' + deviceId + '"></canvas>';
        html += '    </div>';
      }

      if (meter.last_updated) {
        const lastUpdatedStr = new Date(meter.last_updated).toLocaleString();
        html += '    <p class="meter-last-updated">Last updated: ' + escapeHtml(lastUpdatedStr) + '</p>';
      } else if (isStale) {
        html += '    <p class="stale-meter-empty">値がありません（データ未受信）</p>';
      }

      html += '  </div>';
      html += '</div>';
      return html;
    }

    function isStaleMeter(meter) {
      if (!meter.last_updated) {
        return true;
      }

      const lastUpdated = new Date(meter.last_updated);
      if (isNaN(lastUpdated.getTime())) {
        return true;
      }

      return (Date.now() - lastUpdated.getTime()) >= STALE_METER_THRESHOLD_MS;
    }

    // ============================================================
    // Chart rendering (Chart.js v4 API)
    // ============================================================

    function renderCharts() {
      for (const meter of metersData) {
        if (isStaleMeter(meter)) {
          destroyChart(meter.device_id);
          continue;
        }
        fetchHistory(meter.device_id, currentTimeScale)
          .then(function(data) {
            const history = (data && data.history) ? data.history : [];
            renderSingleChart(meter.device_id, history);
          })
          .catch(function() {
            // History for a single meter is non-critical; keep the rest of the dashboard.
          });
      }
    }

    function renderSingleChart(deviceId, history) {
      const canvas = document.getElementById('chart-' + deviceId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const labels = [];
      const temperatures = [];
      for (const entry of history) {
        labels.push(formatTimestamp(entry.timestamp, currentTimeScale));
        temperatures.push(entry.temperature);
      }

      // Destroy existing chart instance before re-creating
      destroyChart(deviceId);

      charts[deviceId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Temperature (C)',
            data: temperatures,
            borderColor: '#d9534f',
            backgroundColor: 'rgba(217, 83, 79, 0.15)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#d9534f',
            pointBorderColor: '#d9534f',
            pointHoverRadius: 5,
            pointHoverBackgroundColor: '#5bc0de',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              mode: 'index',
              intersect: false,
              callbacks: {
                label: function(context) {
                  const v = context.parsed.y;
                  if (v === null || v === undefined) return '';
                  return v.toFixed(1) + '\u00b0C';
                }
              }
            }
          },
          scales: {
            x: {
              display: true,
              grid: {
                display: true,
                color: 'rgba(0, 0, 0, 0.05)'
              },
              ticks: {
                maxTicksLimit: 8,
                font: { size: 10 },
                color: '#777'
              }
            },
            y: {
              display: true,
              grid: {
                display: true,
                color: 'rgba(0, 0, 0, 0.05)'
              },
              ticks: {
                font: { size: 10 },
                color: '#777',
                callback: function(value) {
                  return value + '\u00b0';
                }
              }
            }
          }
        }
      });
    }

    function destroyChart(deviceId) {
      if (charts[deviceId]) {
        charts[deviceId].destroy();
        delete charts[deviceId];
      }
    }

    function destroyAllCharts() {
      for (const key of Object.keys(charts)) {
        destroyChart(key);
      }
      charts = {};
    }

    // ============================================================
    // Init
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {
      refreshDashboard();
      setInterval(refreshDashboard, REFRESH_INTERVAL);

      document.querySelector('#time-scale-select').addEventListener('change', function(event) {
        currentTimeScale = event.target.value;
        destroyAllCharts();
        renderCharts();
      });

      document.querySelector('#btn-refresh').addEventListener('click', async function() {
        const btn = this;
        btn.disabled = true;
        btn.textContent = 'Refreshing...';
        try {
          try {
            await triggerRefresh();
          } catch (err) {
            showError('Failed to refresh: ' + err.message);
          }
          await fetchData();
        } finally {
          btn.disabled = false;
          btn.textContent = 'Refresh Data';
        }
      });

      document.querySelector('#btn-backup').addEventListener('click', function() {
        window.open(API_URL + '/api/backup', '_blank');
      });
    });
  </script>

</body>
</html>
