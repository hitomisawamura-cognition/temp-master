app = "temp-master"
primary_region = "nrt"

[build]
  # The data collector currently runs on snakeroom; set to "" to use this app's own API (same origin).
  [build.args]
    VITE_API_URL = "https://snakeroom.fly.dev"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "temp_master_data"
  destination = "/data"
